version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: preventis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: preventis123
      MYSQL_DATABASE: preventis
      MYSQL_USER: preventis
      MYSQL_PASSWORD: preventis123
    ports:
      - "3306:3306"
    volumes:
      - preventis_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  preventis_mysql_data:
