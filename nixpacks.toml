[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

# Générer Prisma client avant le build
[phases.build]
dependsOn = ["install"]
cmds = [
  "npx prisma generate",
  "npm run build"
]

# Vérifier que Prisma client est généré
[phases.postbuild]
dependsOn = ["build"]
cmds = [
  "ls -la node_modules/.prisma/client || echo 'Prisma client not found'",
  "npx prisma --version"
]

[start]
cmd = "node dist/index.js"
